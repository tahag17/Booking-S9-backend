logging:
  level:
    ROOT: INFO
    org.hibernate.SQL: DEBUG
    fr.ensaetud.Booking_back: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2.server.resource: DEBUG




spring:
  profiles:
    active: dev
  application:
    name: booking-back
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      poolName: Hikari
      auto-commit: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: booking
  liquibase:
    contexts: dev
    change-log: classpath:db/changelog/master.xml
    default-schema: booking
    enabled: true
  #    drop-first: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-k26quqx50xvr3vpw.us.auth0.com/
          audiences:
            -RORXrikrCziAlYH05gERAm1hxxZRaXIg


server:
  port: 8080




okta:
  oauth2:
    issuer:  ${AUTH0_DOMAIN} #same as previous tenant (issuer-uri...)
    client-id: ${AUTH0_CLIENT_ID}
    client-secret: ${AUTH0_CLIENT_SECRET}




application:
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}
  auth0:
    role-landlord-id: ${AUTH0_ROLE_LANDLORD_ID}
